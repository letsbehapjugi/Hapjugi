<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:68px;overflow:visible;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#toast{position:absolute;top:0;left:50%;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 24px);min-height:48px;padding:10px 13px 10px 16px;border:1px solid var(--toast-border,#dbe2ea);border-radius:14px;background:var(--toast-bg,#ffffff);color:var(--toast-text,#172033);box-shadow:0 8px 28px rgba(15,23,42,.20);font-size:14px;font-weight:700;line-height:1.35;opacity:0;visibility:hidden;transform:translate(-50%,-12px);transition:opacity .18s ease,transform .18s ease,visibility .18s;touch-action:pan-y;pointer-events:auto;user-select:none;-webkit-user-select:none}
#toast.visible{opacity:1;visibility:visible;transform:translate(-50%,0)}
#toast .check{display:flex;align-items:center;justify-content:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--toast-accent,#2563eb);color:#fff;font-size:14px;font-weight:800}
#message{overflow-wrap:anywhere;white-space:normal}
#close{display:flex;align-items:center;justify-content:center;flex:0 0 27px;width:27px;height:27px;margin-left:3px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:20px;line-height:1;cursor:pointer;opacity:.65}
#close:hover{background:rgba(127,127,127,.13);opacity:1}
@media(max-width:520px){#toast{font-size:13px;min-height:44px;padding:8px 10px 8px 12px;gap:8px}}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite">
  <span class="check" aria-hidden="true">✓</span>
  <span id="message"></span>
  <button id="close" type="button" aria-label="알림 닫기">×</button>
</div>
<script>
'use strict';
let args={message:'',token:'',duration_ms:5000};
let activeToken='';
let timer=null;
let pointerStartX=null;
let dismissedTokens=new Set();
const toast=document.getElementById('toast');
const message=document.getElementById('message');
function post(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function setHeight(){requestAnimationFrame(()=>post('streamlit:setFrameHeight',{height:68}))}
function hide(sendDismiss=true){
  const token=activeToken;
  toast.classList.remove('visible');
  if(timer){clearTimeout(timer);timer=null;}
  if(token){dismissedTokens.add(token);if(sendDismiss)post('streamlit:setComponentValue',{value:{action:'dismiss',token},dataType:'json'});}
}
function applyTheme(theme={}){
  const root=document.documentElement;
  if(theme.backgroundColor)root.style.setProperty('--toast-bg',String(theme.backgroundColor));
  if(theme.textColor)root.style.setProperty('--toast-text',String(theme.textColor));
  if(theme.borderColor)root.style.setProperty('--toast-border',String(theme.borderColor));
  if(theme.primaryColor)root.style.setProperty('--toast-accent',String(theme.primaryColor));
}
function show(next){
  applyTheme(next.theme||{});
  const token=String(next.token||'');
  const text=String(next.message||'');
  if(!text||!token){activeToken='';toast.classList.remove('visible');if(timer){clearTimeout(timer);timer=null;}return;}
  if(token===activeToken){return;}
  if(dismissedTokens.has(token))return;
  activeToken=token;
  message.textContent=text;
  toast.classList.add('visible');
  if(timer)clearTimeout(timer);
  const duration=Math.max(1000,Number(next.duration_ms)||5000);
  timer=setTimeout(()=>hide(true),duration);
  setHeight();
}
document.getElementById('close').addEventListener('click',()=>hide(true));
toast.addEventListener('pointerdown',event=>{pointerStartX=event.clientX;});
toast.addEventListener('pointerup',event=>{
  if(pointerStartX===null)return;
  const dx=event.clientX-pointerStartX;
  pointerStartX=null;
  if(Math.abs(dx)>55)hide(true);
});
toast.addEventListener('pointercancel',()=>{pointerStartX=null;});
window.addEventListener('message',event=>{
  const data=event.data;
  if(!data||data.type!=='streamlit:render')return;
  const next=data.args||data;
  args={...next};
  show(args);
});
post('streamlit:componentReady',{apiVersion:1});
setHeight();
</script>
</body>
</html>
